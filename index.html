<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cakevelys — Custom Cake, Cookie & Mentai Cake · Banyumanik, Semarang</title>
<meta name="description" content="Cakevelys — custom cake, cookie cake, dan mentai cake handmade dari Banyumanik, Semarang. Desain sesuai keinginanmu, pemesanan mudah lewat WhatsApp." />
<link rel="icon" href="logo%20cakevelys.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   Cakevelys — Professional single-file site
   Editorial bakery · deep berry + warm cream
   ========================================================= */
:root{
  --cream:#FBF6F0;--cream-2:#F6ECE4;--paper:#FFFFFF;
  --blush:#FAEDE9;--blush-2:#F5E2DD;
  --berry:#9E2B46;--berry-d:#7E2038;--berry-ink:#5E1A2B;
  --rose:#C86F86;--rose-soft:#E4A9B6;
  --ink:#2A211F;--body:#6A5C56;--muted:#9B8D86;--line:#EADFD7;
  --gold:#B08D57;
  --shadow-xs:0 1px 2px rgba(60,30,30,.05);
  --shadow-sm:0 4px 14px rgba(120,40,60,.08);
  --shadow:0 12px 34px rgba(120,40,60,.12);
  --shadow-lg:0 24px 60px rgba(90,30,45,.18);
  --r-sm:12px;--r:16px;--r-lg:24px;--r-xl:32px;--pill:999px;
  --wrap:1200px;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
  --f-head:"Playfair Display",Georgia,serif;
  --f-script:"Dancing Script",cursive;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);color:var(--body);background:var(--cream);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;opacity:0;transition:opacity .5s ease}
body.ready{opacity:1}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}ul{list-style:none;padding:0}
::selection{background:var(--rose-soft);color:var(--berry-ink)}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 22px}
.section{padding:72px 0}
@media(min-width:860px){.section{padding:96px 0}}
.text-center{text-align:center}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;line-height:1.14;color:var(--ink);letter-spacing:-.01em}
em,.italic{font-style:italic;font-family:var(--f-head)}
.kicker{display:inline-block;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--berry)}
.kicker.on-dark{color:var(--rose-soft)}
.section-title{font-size:clamp(1.9rem,4.6vw,3rem);margin-top:14px}
.lead{color:var(--body);max-width:560px}
.center-head{max-width:640px;margin:0 auto 52px;text-align:center}
.center-head .lead{margin:16px auto 0}
/* flourish divider */
.flourish{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 0;max-width:220px}
.flourish .ln{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--rose-soft))}
.flourish .ln:last-child{background:linear-gradient(90deg,var(--rose-soft),transparent)}
.flourish svg{width:18px;height:18px;color:var(--rose)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:.94rem;padding:14px 28px;border-radius:var(--pill);transition:.25s var(--ease);white-space:nowrap;letter-spacing:.01em}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--berry);color:#fff;box-shadow:0 6px 18px rgba(158,43,70,.28)}
.btn-primary:hover{background:var(--berry-d);transform:translateY(-2px);box-shadow:0 10px 26px rgba(158,43,70,.34)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--berry);border:1.5px solid var(--rose-soft)}
.btn-outline:hover{background:var(--blush);border-color:var(--berry)}
.btn-light{background:#fff;color:var(--berry);box-shadow:var(--shadow-sm)}.btn-light:hover{transform:translateY(-2px)}
.btn-wa{background:#1FA855;color:#fff}.btn-wa:hover{background:#188544;transform:translateY(-2px)}
.btn-ghost{color:var(--berry);padding:10px 8px}.btn-ghost:hover{color:var(--berry-d)}
.btn-block{width:100%}.btn-lg{padding:16px 34px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.09s}.reveal.d2{transition-delay:.18s}.reveal.d3{transition-delay:.27s}.reveal.d4{transition-delay:.36s}
/* =========================================================
   HEADER
   ========================================================= */
.site-header{position:sticky;top:0;z-index:100;background:rgba(251,246,240,.8);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s var(--ease)}
.site-header.scrolled{background:rgba(251,246,240,.94);border-bottom-color:var(--line);box-shadow:0 6px 24px rgba(120,40,60,.06)}
.nav{display:flex;align-items:center;justify-content:space-between;height:84px;transition:height .3s var(--ease)}
.site-header.scrolled .nav{height:68px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow-sm);transition:.3s var(--ease)}
.site-header.scrolled .brand img{width:40px;height:40px}
.brand .wm{font-family:var(--f-script);font-size:1.7rem;color:var(--berry);line-height:1}
.brand .wmsub{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.nav-links{display:none;align-items:center;gap:2px}
.nav-links a{position:relative;font-weight:500;font-size:.9rem;color:var(--ink);padding:10px 15px;border-radius:var(--pill);transition:.2s}
.nav-links a::after{content:"";position:absolute;left:15px;right:15px;bottom:6px;height:1.5px;background:var(--berry);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav-links a:hover{color:var(--berry)}.nav-links a:hover::after{transform:scaleX(1)}
.nav-links a.active{color:var(--berry)}.nav-links a.active::after{transform:scaleX(1)}
.nav-actions{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:var(--ink);transition:.2s}
.icon-btn:hover{background:var(--blush);color:var(--berry)}
.icon-btn svg{width:21px;height:21px}
.cart-badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;background:var(--berry);color:#fff;font-size:.66rem;font-weight:700;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;border:2px solid var(--cream)}
.cart-badge.hidden{display:none}
.nav-cta{display:none}
.nav-toggle{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;color:var(--ink)}
.nav-toggle svg{width:24px;height:24px}
.mobile-menu{position:fixed;inset:0 0 0 auto;width:min(84vw,340px);z-index:120;background:var(--cream);box-shadow:var(--shadow-lg);padding:26px 24px;transform:translateX(100%);transition:transform .34s var(--ease);display:flex;flex-direction:column}
.mobile-menu.open{transform:translateX(0)}
.mm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mm-head .wm{font-family:var(--f-script);font-size:1.5rem;color:var(--berry)}
.mobile-menu a{display:flex;align-items:center;gap:10px;padding:15px 6px;font-weight:500;font-size:1.05rem;border-bottom:1px solid var(--line);color:var(--ink)}
.mobile-menu a.active{color:var(--berry)}
.mm-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:18px}
.backdrop{position:fixed;inset:0;background:rgba(42,33,31,.4);backdrop-filter:blur(2px);z-index:119;opacity:0;pointer-events:none;transition:.3s}
.backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:960px){.nav-links{display:flex}.nav-toggle{display:none}.nav-cta{display:inline-flex}}
/* =========================================================
   FAB + back to top
   ========================================================= */
.fab-wa{position:fixed;right:20px;bottom:20px;z-index:90;display:inline-flex;align-items:center;gap:10px;background:#1FA855;color:#fff;font-weight:600;font-size:.9rem;padding:14px 18px;border-radius:var(--pill);box-shadow:0 10px 26px rgba(31,168,85,.42);transition:.25s var(--ease)}
.fab-wa svg{width:22px;height:22px}.fab-wa .lbl{display:none}
.fab-wa:hover{transform:translateY(-3px)}
@media(min-width:600px){.fab-wa .lbl{display:inline}}
.to-top{position:fixed;left:20px;bottom:20px;z-index:89;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--berry);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top svg{width:20px;height:20px}
/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--cream) 0%,var(--cream) 60%,var(--blush) 100%)}
.hero::before{content:"";position:absolute;top:-180px;right:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--blush-2),transparent 68%);opacity:.8}
.hero-grid{position:relative;display:grid;gap:36px;padding:48px 0 64px;align-items:center}
.hero-copy h1{font-size:clamp(2.5rem,7vw,4.4rem);line-height:1.04;color:var(--ink)}
.hero-copy h1 em{color:var(--berry)}
.hero-copy .lead{font-size:1.08rem;margin:20px 0 30px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.trust-row{display:flex;flex-wrap:wrap;gap:22px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.trust{display:flex;align-items:center;gap:10px}
.trust .ic{width:38px;height:38px;border-radius:11px;background:var(--blush);color:var(--berry);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.trust .ic svg{width:19px;height:19px}
.trust b{display:block;font-size:.82rem;color:var(--ink);font-weight:600;line-height:1.3}
.trust span{font-size:.74rem;color:var(--muted)}
/* hero visual collage */
.hero-visual{position:relative;aspect-ratio:1/1;max-width:520px;margin:0 auto;width:100%}
.hv-main{position:absolute;inset:6% 10% 14% 2%;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);background:var(--blush)}
.hv-main img{width:100%;height:100%;object-fit:cover}
.hv-sub{position:absolute;width:46%;aspect-ratio:3/4;right:2%;bottom:2%;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);border:5px solid var(--cream);background:var(--blush)}
.hv-sub img{width:100%;height:100%;object-fit:cover}
.hv-badge{position:absolute;top:2%;right:6%;width:92px;height:92px;border-radius:50%;background:#fff;box-shadow:var(--shadow);padding:6px;animation:float 5s ease-in-out infinite}
.hv-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hv-tag{position:absolute;left:0;bottom:6%;background:#fff;border-radius:var(--pill);padding:9px 16px 9px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;font-size:.8rem;font-weight:600;color:var(--ink)}
.hv-tag .dot{width:30px;height:30px;border-radius:50%;background:var(--blush);color:var(--berry);display:flex;align-items:center;justify-content:center}
.hv-tag .dot svg{width:16px;height:16px}
@media(min-width:960px){.hero-grid{grid-template-columns:1.02fr .98fr;padding:72px 0 96px;gap:48px}.hero-visual{max-width:none}}
/* marquee band */
.band{background:var(--berry);color:#fff;overflow:hidden;white-space:nowrap}
.band-track{display:inline-flex;gap:46px;padding:15px 0;animation:marq 26s linear infinite;font-size:.84rem;letter-spacing:.06em;font-weight:500}
.band-track span{display:inline-flex;align-items:center;gap:46px;opacity:.95}
.band-track i{font-style:normal;color:var(--rose-soft)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* =========================================================
   MENU CARDS (home)
   ========================================================= */
.menu-grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:640px){.menu-grid{grid-template-columns:repeat(3,1fr)}}
.menu-card{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:#fff;transition:.4s var(--ease);display:block;border:1px solid var(--line)}
.menu-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.menu-card .mc-img{aspect-ratio:4/5;overflow:hidden}
.menu-card .mc-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.menu-card:hover .mc-img img{transform:scale(1.07)}
.menu-card .mc-body{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(0deg,rgba(30,18,20,.86) 0%,rgba(30,18,20,.5) 55%,transparent 100%);color:#fff}
.menu-card h3{color:#fff;font-size:1.4rem}
.menu-card .mc-price{font-size:.86rem;color:var(--rose-soft);font-weight:600;margin-top:2px}
.menu-card .mc-go{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:.84rem;font-weight:600;color:#fff}
.menu-card .mc-go svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.menu-card:hover .mc-go svg{transform:translateX(5px)}
/* row head (section title + view all) */
.row-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:30px;flex-wrap:wrap}
.row-head .rh-l .kicker{margin-bottom:8px}
.row-head h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.view-all{color:var(--berry);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.2s}
.view-all svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.view-all:hover{color:var(--berry-d)}.view-all:hover svg{transform:translateX(4px)}
/* featured products */
.feat-grid{display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
@media(min-width:960px){.feat-grid{grid-template-columns:repeat(4,1fr)}}
.feat-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-xs);transition:.3s var(--ease)}
.feat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--rose-soft)}
.feat-card .fm{position:relative;aspect-ratio:1;overflow:hidden;background:var(--blush)}
.feat-card .fm img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.feat-card:hover .fm img{transform:scale(1.06)}
.feat-card .fm .ftag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--berry);font-size:.64rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:var(--pill);backdrop-filter:blur(4px)}
.feat-b{padding:15px;display:flex;flex-direction:column;flex:1}
.feat-b .ft{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.feat-b h4{font-size:1.06rem;color:var(--ink)}
.feat-b .fp{color:var(--berry);font-weight:700;margin-top:3px}
.feat-b .fp .s{font-size:.72rem;color:var(--muted);font-weight:500}
.feat-b .btn{margin-top:13px;padding:11px 18px;font-size:.86rem}
/* stat band */
.statband{position:relative;overflow:hidden;background:var(--berry);color:#fff;border-radius:var(--r-xl);padding:44px 30px;display:grid;gap:26px;grid-template-columns:repeat(2,1fr);text-align:center}
.statband::before{content:"";position:absolute;top:-80px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.statband .st{position:relative}
.statband .st .num{font-family:var(--f-head);font-size:clamp(2rem,5vw,2.8rem);color:#fff;line-height:1}
.statband .st .lb{font-size:.82rem;opacity:.82;margin-top:7px}
@media(min-width:760px){.statband{grid-template-columns:repeat(4,1fr)}}
/* about teaser */
.about-teaser{display:grid;gap:32px;align-items:center}
@media(min-width:860px){.about-teaser{grid-template-columns:.92fr 1.08fr}}
.at-img{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3}
.at-img img{width:100%;height:100%;object-fit:cover}
/* =========================================================
   VALUES
   ========================================================= */
.values-grid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:720px){.values-grid{grid-template-columns:repeat(3,1fr)}}
.value{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 26px;transition:.3s var(--ease)}
.value:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.value .vic{width:54px;height:54px;border-radius:15px;background:var(--blush);color:var(--berry);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.value .vic svg{width:26px;height:26px}
.value h4{font-size:1.2rem;margin-bottom:8px}
.value p{font-size:.92rem;color:var(--body)}
/* =========================================================
   GALLERY (scroll strip)
   ========================================================= */
.gallery{display:flex;gap:16px;overflow-x:auto;padding:6px 22px 20px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .wrap-inner{display:flex;gap:16px}
.gcard{flex:0 0 auto;width:260px;aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;scroll-snap-align:start;box-shadow:var(--shadow-sm);background:var(--blush);position:relative;cursor:pointer}
.gcard img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.gcard:hover img{transform:scale(1.06)}
.gcard .gcap{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(0deg,rgba(30,18,20,.8),transparent);color:#fff;font-size:.82rem;font-weight:600;opacity:0;transition:.3s}
.gcard:hover .gcap{opacity:1}
@media(min-width:720px){.gcard{width:300px}}
/* =========================================================
   TESTIMONIALS carousel
   ========================================================= */
.tcar{position:relative}
.tcar-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:6px 2px 10px;scrollbar-width:none}
.tcar-track::-webkit-scrollbar{display:none}
.tcard{flex:0 0 86%;scroll-snap-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
@media(min-width:720px){.tcard{flex-basis:46%}}
@media(min-width:1040px){.tcard{flex-basis:31.5%}}
.tcard .quo{font-family:var(--f-head);font-size:3rem;line-height:.6;color:var(--rose-soft);height:28px}
.tcard .stars{color:#E8A93C;letter-spacing:2px;font-size:.95rem;margin:10px 0 6px}
.tcard h4{font-size:1.1rem;margin-bottom:8px}
.tcard p{color:var(--body);font-size:.92rem;flex:1}
.tcard .who{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.tcard .av{width:42px;height:42px;border-radius:50%;background:var(--berry);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--f-head)}
.tcard .who .nm{font-weight:600;font-size:.9rem;color:var(--ink)}
.tcard .who .hd{font-size:.76rem;color:var(--muted)}
.tcard .pcat{align-self:flex-start;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--berry);background:var(--blush);padding:4px 11px;border-radius:var(--pill);margin-bottom:12px}
.car-nav{display:flex;gap:10px;justify-content:center;margin-top:24px}
.car-nav button{width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--berry);display:flex;align-items:center;justify-content:center;transition:.2s}
.car-nav button:hover{background:var(--berry);color:#fff;border-color:var(--berry)}
.car-nav svg{width:20px;height:20px}
/* review CTA */
.rev-cta{position:relative;overflow:hidden;margin-top:56px;text-align:center;background:var(--berry);color:#fff;border-radius:var(--r-xl);padding:56px 26px}
.rev-cta::before,.rev-cta::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06)}
.rev-cta::before{top:-120px;left:-80px}.rev-cta::after{bottom:-140px;right:-60px}
.rev-cta .in-c{position:relative}
.rev-cta h2{color:#fff;font-size:clamp(1.7rem,4.5vw,2.4rem)}
.rev-cta p{max-width:460px;margin:12px auto 24px;opacity:.92}
/* =========================================================
   SHOP
   ========================================================= */

const CART_KEY="cakevelys_cart",PROFILE_KEY="cakevelys_profile",ORDERS_KEY="cakevelys_orders";
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){return[]}}

function cartCount(){return getCart().reduce((n,i)=>n+(i.qty||1),0)}
function updateCartCount(){const n=cartCount();document.querySelectorAll(".cart-badge").forEach(b=>{b.textContent=n;b.classList.toggle("hidden",n===0)})}
function getProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY))||{name:"",phone:""}}catch(e){return{name:"",phone:""}}}
function saveProfile(p){localStorage.setItem(PROFILE_KEY,JSON.stringify({...getProfile(),...p}))}
function getOrders(){try{return JSON.parse(localStorage.getItem(ORDERS_KEY))||[]}catch(e){return[]}}
function saveOrder(o){const l=getOrders();l.unshift(o);localStorage.setItem(ORDERS_KEY,JSON.stringify(l.slice(0,30)))}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHTML(s||"")}

/* toast */
let _tt;function toast(m,chk=true){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.innerHTML=(chk?ICON.check:"")+"<span>"+m+"</span>";requestAnimationFrame(()=>t.classList.add("show"));clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove("show"),2400)}
/* reveal + header scroll + totop */
function initReveal(){
 const els=document.querySelectorAll(".reveal:not(.in)");
 if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
 const io=new IntersectionObserver((ents,obs)=>{ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target)}})},{threshold:.12,rootMargin:"0px 0px -40px 0px"});
 els.forEach(e=>io.observe(e));
}
function syncHeader(){const h=document.getElementById("siteHeader");if(h)h.classList.toggle("scrolled",window.scrollY>12);const t=document.getElementById("toTop");if(t)t.classList.toggle("show",window.scrollY>600)}

function filterShop(key,btn){

let CZ=null;
function openCustomizer(catKey,itemId){
 const cat=getCategory(catKey),item=getItem(catKey,itemId);if(!cat||!item)return;
 CZ={catKey,itemId,flavour:cat.options?.flavour?cat.options.flavour.choices[0].name:null,flavourAdd:cat.options?.flavour?cat.options.flavour.choices[0].add:0,shape:cat.options?.shape?cat.options.shape.choices[0].name:null,filling:item.fillings?item.fillings[0].name:null,fillingPrice:item.fillings?item.fillings[0].price:null,text:"",addons:{},qty:1};
 buildModal(cat,item);document.getElementById("cz-overlay").classList.add("open");document.body.style.overflow="hidden";
}
function closeCustomizer(){document.getElementById("cz-overlay")?.classList.remove("open");document.body.style.overflow="";CZ=null}
function getCategory(k){return CATALOG.find(c=>c.key===k)}
function getItem(k,id){const c=getCategory(k);return c?c.items.find(i=>i.id===id):null}
function buildModal(cat,item){
 let ov=document.getElementById("cz-overlay");
 if(!ov){ov=document.createElement("div");ov.id="cz-overlay";ov.className="modal-overlay";ov.addEventListener("click",e=>{if(e.target===ov)closeCustomizer()});document.body.appendChild(ov)}
 let flavourHTML="";
 if(cat.options?.flavour){const o=cat.options.flavour.choices.map(c=>`<option value="${c.name}" data-add="${c.add}">${c.name}${c.desc?" — "+c.desc:""}</option>`).join("");flavourHTML=`<div class="field"><label>${cat.options.flavour.label} <span class="req">*</span></label><select id="cz-flavour" onchange="onFlavourChange()">${o}</select></div>`}
 let shapeHTML="";
 if(cat.options?.shape){const ch=cat.options.shape.choices.map((c,i)=>`<button type="button" class="chip ${i===0?"selected":""}" onclick="onShapePick(this,'${c.name}')">${c.name}</button>`).join("");shapeHTML=`<div class="field"><label>${cat.options.shape.label} <span class="req">*</span></label><div class="chips" id="cz-shape">${ch}</div></div>`}
 let fillingHTML="";
 if(item.fillings){const ch=item.fillings.map((f,i)=>`<button type="button" class="chip ${i===0?"selected":""}" onclick="onFillingPick(this,'${f.name}',${f.price})">${f.name} · ${rupiah(f.price)}</button>`).join("");fillingHTML=`<div class="field"><label>Topping <span class="req">*</span></label><div class="chips" id="cz-filling">${ch}</div></div>`}
 let textHTML="";
 if(cat.hasText){textHTML=`<div class="field"><label>Request Tulisan / Karakter</label><textarea id="cz-text" placeholder="Contoh: Tulisan 'Happy Birthday Sarah', karakter Hello Kitty, warna pastel pink..." oninput="CZ.text=this.value"></textarea><div class="hint">Foto referensi bisa dikirim saat konfirmasi di WhatsApp.</div></div>`}
 const addonHTML=ADDONS.map(a=>{
  if(a.qty)return `<label class="addon"><input type="checkbox" onchange="onAddonToggle('${a.id}',this.checked)"><span class="addon-name">${a.name} <span class="addon-price">(${a.note})</span></span><span class="qty-mini"><input type="number" id="addon-qty-${a.id}" min="1" value="1" onchange="onAddonQty('${a.id}',this.value)"><span style="font-size:.78rem;color:var(--muted)">pcs</span></span></label>`;
  return `<label class="addon"><input type="checkbox" onchange="onAddonToggle('${a.id}',this.checked)"><span class="addon-name">${a.name}</span><span class="addon-price">${a.note}</span></label>`;
 }).join("");
 const waC=encodeURIComponent(`Halo Cakevelys, saya ingin konsultasi desain untuk ${cat.title} ukuran ${item.size}. Boleh dibantu?`);
 ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
   <div class="modal-head"><h3>${cat.title} · ${item.size}</h3><button class="modal-close" onclick="closeCustomizer()">${ICON.close}</button></div>
   <div class="modal-body">
     <div class="modal-media"><img src="${item.img}" alt="${cat.title} ${item.size}" onerror="this.src='${CAKEVELYS.logo}';this.style.objectFit='contain';this.style.padding='22px';this.style.background='#fff'"></div>
     ${flavourHTML}${shapeHTML}${fillingHTML}${textHTML}
     <div class="field"><label>Add-ons <span style="font-weight:400;color:var(--muted);font-size:.8rem">(opsional)</span></label><div class="addon-list">${addonHTML}</div></div>
     <div class="field"><label>Jumlah</label><div class="qty"><button type="button" onclick="onQty(-1)">−</button><input type="number" id="cz-qty" value="1" min="1" onchange="onQtyInput(this.value)"><button type="button" onclick="onQty(1)">+</button></div></div>
     <div class="note-banner">${ICON.info}<span>Harga di atas <b>belum termasuk design fee</b>. Design fee & ongkir dikonfirmasi admin via WhatsApp sesuai tingkat kerumitan desain.</span></div>
   </div>
   <div class="modal-foot">
     <div class="modal-total"><span class="lbl">Estimasi harga</span><span class="val" id="cz-total">${rupiah(czPrice())}</span></div>
     <div class="row"><a class="btn btn-outline" href="${CAKEVELYS.waLink}?text=${waC}" target="_blank" rel="noopener" style="flex:1">Konsultasi</a><button class="btn btn-primary" style="flex:1.4" onclick="addCurrentToCart()">Tambah ke Keranjang</button></div>
   </div></div>`;
}
function onFlavourChange(){const s=document.getElementById("cz-flavour"),o=s.options[s.selectedIndex];CZ.flavour=o.value;CZ.flavourAdd=Number(o.dataset.add||0);refreshTotal()}
function onShapePick(b,n){document.querySelectorAll("#cz-shape .chip").forEach(c=>c.classList.remove("selected"));b.classList.add("selected");CZ.shape=n}
function onFillingPick(b,n,p){document.querySelectorAll("#cz-filling .chip").forEach(c=>c.classList.remove("selected"));b.classList.add("selected");CZ.filling=n;CZ.fillingPrice=p;refreshTotal()}
function onAddonToggle(id,ch){if(ch){const a=ADDONS.find(x=>x.id===id);CZ.addons[id]={qty:a.qty?Number(document.getElementById("addon-qty-"+id)?.value||1):1}}else delete CZ.addons[id];refreshTotal()}
function onAddonQty(id,v){if(CZ.addons[id]){CZ.addons[id].qty=Math.max(1,Number(v)||1);refreshTotal()}}
function onQty(d){CZ.qty=Math.max(1,CZ.qty+d);document.getElementById("cz-qty").value=CZ.qty;refreshTotal()}
function onQtyInput(v){CZ.qty=Math.max(1,Number(v)||1);document.getElementById("cz-qty").value=CZ.qty;refreshTotal()}
function refreshTotal(){const e=document.getElementById("cz-total");if(e)e.textContent=rupiah(czPrice())}
function czUnitPrice(){const item=getItem(CZ.catKey,CZ.itemId);let base=item.fillings?(CZ.fillingPrice!=null?CZ.fillingPrice:item.fillings[0].price):item.price;let u=base+(CZ.flavourAdd||0);for(const id in CZ.addons){const a=ADDONS.find(x=>x.id===id);u+=a.price*(CZ.addons[id].qty||1)}return u}
function czPrice(){return czUnitPrice()*(CZ.qty||1)}
function addCurrentToCart(){
 const cat=getCategory(CZ.catKey),item=getItem(CZ.catKey,CZ.itemId);
 const addonList=Object.keys(CZ.addons).map(id=>{const a=ADDONS.find(x=>x.id===id),q=CZ.addons[id].qty||1;return {name:a.name+(a.qty?` ×${q}`:""),price:a.price*q}});
 const line={uid:"l"+Date.now()+Math.floor(Math.random()*1000),category:cat.title,catKey:CZ.catKey,productName:`${cat.title} ${item.size}`,size:item.size,img:item.img,flavour:CZ.flavour,shape:CZ.shape,filling:CZ.filling,text:(CZ.text||"").trim(),addons:addonList,qty:CZ.qty,unitPrice:czUnitPrice(),lineTotal:czPrice()};
 const c=getCart();c.push(line);saveCart(c);closeCustomizer();toast("Ditambahkan ke keranjang")}

 const prof=getProfile();
 const items=cart.map(it=>{
  const d=[];if(it.flavour)d.push(`<b>Rasa:</b> ${it.flavour}`);if(it.shape)d.push(`<b>Bentuk:</b> ${it.shape}`);if(it.filling)d.push(`<b>Topping:</b> ${it.filling}`);if(it.addons&&it.addons.length)d.push(`<b>Add-on:</b> ${it.addons.map(a=>a.name).join(", ")}`);if(it.text)d.push(`<b>Request:</b> "${escapeHTML(it.text)}"`);
  return `<div class="cart-item"><div class="cart-item-media"><img src="${it.img}" alt="${it.productName}" onerror="this.src='${CAKEVELYS.logo}';this.style.objectFit='contain';this.style.padding='8px';this.style.background='#fff'"></div>
   <div><h4>${it.productName}</h4><div class="meta">${d.join("<br>")}</div>
   <div class="cart-item-foot"><div class="qty"><button type="button" onclick="changeQty('${it.uid}',-1)">−</button><input type="number" value="${it.qty}" min="1" onchange="setQty('${it.uid}',this.value)"><button type="button" onclick="changeQty('${it.uid}',1)">+</button></div>
   <div style="display:flex;align-items:center;gap:14px"><span class="line-price">${rupiah(it.lineTotal)}</span><button class="remove" onclick="removeItem('${it.uid}')">${ICON.trash} Hapus</button></div></div></div></div>`;
 }).join("");
 const subtotal=cart.reduce((s,it)=>s+it.lineTotal,0);
 root.innerHTML=`<div class="cart-layout"><div><h2 style="margin-bottom:18px;font-size:1.5rem">Keranjang · ${cartCount()} item</h2>${items}<a href="#shop" class="btn btn-ghost">${ICON.chevL} Lanjut belanja</a></div>
  <div><div class="summary"><h3>Data Pemesan</h3>
   <div class="field"><label>Nama <span class="req">*</span></label><input type="text" id="buyer-name" placeholder="Nama kamu" value="${escapeAttr(prof.name)}"></div>
   <div class="field"><label>No. WhatsApp <span class="req">*</span></label><input type="tel" id="buyer-phone" placeholder="08xxxxxxxxxx" value="${escapeAttr(prof.phone)}"></div>
   <div class="field"><label>Tanggal Ambil / Kirim <span class="req">*</span></label><input type="date" id="buyer-date" min="${minPickupDate()}"><div class="hint">Pemesanan maksimal H-1.</div></div>
   <div class="field"><label>Metode</label><select id="buyer-method"><option value="Self Pick-up">Self Pick-up (ambil sendiri)</option><option value="Pengiriman Ojol (Shopee/Gosend/Grab)">Pengiriman Ojol (Shopee/Gosend/Grab)</option></select></div>
   <div class="field"><label>Catatan (opsional)</label><textarea id="buyer-note" placeholder="Jam ambil, request tambahan, dll."></textarea></div>
   <div class="summary-row"><span>Subtotal</span><span>${rupiah(subtotal)}</span></div>
   <div class="summary-row"><span class="muted">Design fee</span><span class="muted">dikonfirmasi admin</span></div>
   <div class="summary-row"><span class="muted">Ongkir</span><span class="muted">sesuai metode</span></div>
   <div class="summary-row total"><span>Total</span><span class="v">${rupiah(subtotal)}</span></div>
   <p class="muted mt-8">Belum termasuk design fee & ongkir. Total final dikonfirmasi admin via WhatsApp.</p>
   <button class="btn btn-primary btn-block btn-lg mt-16" onclick="startCheckout()">Checkout · Bayar QRIS ${ICON.arrow}</button>
  </div></div></div>`;
}
function changeQty(uid,d){const c=getCart(),it=c.find(x=>x.uid===uid);if(!it)return;it.qty=Math.max(1,it.qty+d);it.lineTotal=it.unitPrice*it.qty;saveCart(c);renderCart()}
function setQty(uid,v){const c=getCart(),it=c.find(x=>x.uid===uid);if(!it)return;it.qty=Math.max(1,Number(v)||1);it.lineTotal=it.unitPrice*it.qty;saveCart(c);renderCart()}
function removeItem(uid){saveCart(getCart().filter(x=>x.uid!==uid));renderCart();toast("Item dihapus",false)}
function val(id){return (document.getElementById(id)?.value||"").trim()}
function startCheckout(){
 const name=val("buyer-name"),phone=val("buyer-phone"),date=val("buyer-date");
 if(!name||!phone||!date){toast("Lengkapi nama, WA & tanggal dulu ya",false);[["buyer-name",name],["buyer-phone",phone],["buyer-date",date]].forEach(([id,v])=>{const el=document.getElementById(id);if(el&&!v){el.style.borderColor="var(--berry)";el.focus()}});return}
 saveProfile({name,phone});
 const cart=getCart(),subtotal=cart.reduce((s,it)=>s+it.lineTotal,0);
 openQris({orderNo:genOrderNo(),name,phone,date,method:val("buyer-method"),note:val("buyer-note"),items:cart,subtotal,createdAt:new Date().toISOString()});
}
function openQris(order){
 let ov=document.getElementById("qris-overlay");
 if(!ov){ov=document.createElement("div");ov.id="qris-overlay";ov.className="modal-overlay";ov.addEventListener("click",e=>{if(e.target===ov)closeQris()});document.body.appendChild(ov)}
 ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-width:460px">
   <div class="modal-head"><h3>Pembayaran QRIS</h3><button class="modal-close" onclick="closeQris()">${ICON.close}</button></div>
   <div class="modal-body qris-box">
     <p style="color:var(--muted);font-size:.9rem">No. Pesanan <b style="color:var(--berry)">${order.orderNo}</b></p>
     <div class="qris-img"><img src="${CAKEVELYS.qris}" alt="QRIS Cakevelys" onerror="this.parentElement.innerHTML='<div class=&quot;qris-fallback&quot;>Barcode QRIS<br><br>Simpan file <b>${CAKEVELYS.qris}</b> di root repo, otomatis muncul di sini.</div>'"></div>
     <p style="font-size:.85rem;color:var(--muted)">Nominal transfer</p>
     <div class="qris-amount">${rupiah(order.subtotal)}</div>
     <p class="muted" style="font-size:.78rem;margin-top:4px">*Belum termasuk design fee & ongkir — admin akan konfirmasi kekurangannya.</p>
     <ul class="steps-mini">
       <li><span class="n">1</span> Scan QRIS di atas menggunakan e-wallet atau m-banking.</li>
       <li><span class="n">2</span> Bayar sesuai nominal, lalu screenshot bukti pembayaran.</li>
       <li><span class="n">3</span> Klik tombol di bawah untuk kirim bukti + referensi desain ke WhatsApp.</li>
     </ul>
   </div>
   <div class="modal-foot"><button class="btn btn-wa btn-block btn-lg" onclick="confirmAndWhatsApp()">${ICON.wa} Konfirmasi Pembayaran & Kirim Referensi Desain</button>
   <p class="muted text-center" style="font-size:.76rem">Kamu akan diarahkan ke WhatsApp Cakevelys dengan detail pesanan terisi otomatis.</p></div></div>`;
 window.__activeOrder=order;ov.classList.add("open");document.body.style.overflow="hidden";
}
function closeQris(){document.getElementById("qris-overlay")?.classList.remove("open");document.body.style.overflow=""}
function confirmAndWhatsApp(){
 const o=window.__activeOrder;if(!o)return;
 const url=`${CAKEVELYS.waLink}?text=${encodeURIComponent(buildWaMessage(o))}`;
 saveOrder(o);saveCart([]);window.open(url,"_blank");closeQris();showThankYou(o);
}
function buildWaMessage(o){
 const L=[];
 L.push("Halo, saya sudah membayar via QRIS. Berikut referensi desain untuk pesanan saya:");L.push("");
 L.push(`🧾 No. Pesanan: ${o.orderNo}`);L.push(`👤 Nama: ${o.name}`);L.push(`📱 No. HP: ${o.phone}`);
 L.push(`📅 Tanggal Ambil/Kirim: ${formatDateID(o.date)}`);L.push(`🚗 Metode: ${o.method}`);L.push("");
 L.push("🛒 Detail Pesanan:");
 o.items.forEach((it,i)=>{const s=[];if(it.flavour)s.push(it.flavour);if(it.shape)s.push(it.shape);if(it.filling)s.push("Topping "+it.filling);L.push(`${i+1}. ${it.productName}${s.length?" — "+s.join(", "):""}`);if(it.text)L.push(`   ✍️ Tulisan: "${it.text}"`);if(it.addons&&it.addons.length)L.push(`   ➕ Add-on: ${it.addons.map(a=>a.name).join(", ")}`);L.push(`   ${it.qty} × ${rupiah(it.unitPrice)} = ${rupiah(it.lineTotal)}`)});
 L.push("");L.push(`💰 Subtotal: ${rupiah(o.subtotal)}`);L.push("(belum termasuk design fee & ongkir)");
 if(o.note){L.push("");L.push(`📝 Catatan: ${o.note}`)}
 L.push("");L.push("Berikut saya lampirkan bukti pembayaran & foto referensi desainnya ya.");
 return L.join("\n");
}
function showThankYou(o){
 const root=document.getElementById("cart-root");if(!root)return;
 root.innerHTML=`<div class="empty-state"><div class="es-ic">${ICON.check}</div><h3>Pesanan siap dikonfirmasi</h3>
  <p>No. Pesanan <b style="color:var(--berry)">${o.orderNo}</b><br>Tab WhatsApp sudah terbuka — tinggal kirim chat beserta bukti bayar & foto referensi desain.<br><span style="font-size:.85rem">Jika tab WhatsApp tidak terbuka otomatis, klik tombol di bawah.</span></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn btn-wa btn-lg" href="${CAKEVELYS.waLink}?text=${encodeURIComponent(buildWaMessage(o))}" target="_blank" rel="noopener">${ICON.wa} Buka WhatsApp</a><a class="btn btn-outline btn-lg" href="#shop">Pesan Lagi</a></div></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function genOrderNo(){const d=new Date();return `${CAKEVELYS.orderPrefix}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.floor(1000+Math.random()*9000)}`}
function pad(n){return String(n).padStart(2,"0")}
function minPickupDate(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function formatDateID(iso){if(!iso)return"-";const[y,m,day]=iso.split("-");const b=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];return `${day} ${b[Number(m)-1]} ${y}`}

/* =========================================================
   REVIEW + ACCOUNT
   ========================================================= */
function renderReviews(){const root=document.getElementById("review-root");if(!root)return;
 const grid=REVIEWS.map(r=>{const stars="★".repeat(r.stars)+"☆".repeat(5-r.stars);return `<article class="tcard reveal"><span class="pcat">${r.cat}</span><div class="stars">${stars}</div><h4>${r.title}</h4><p>${r.body}</p><div class="who"><div class="av">${r.name.charAt(0)}</div><div><div class="nm">${r.name}</div><div class="hd">${r.handle}</div></div></div></article>`}).join("");
 root.innerHTML=`<div style="display:grid;gap:20px;grid-template-columns:1fr">${grid}</div>
  <div class="rev-cta reveal"><div class="in-c"><h2>Your Sweet Words Matter ♡</h2><p>Udah pernah cobain Cakevelys? Ceritain pengalaman kamu juga, dong!</p><a class="btn btn-light btn-lg" href="${CAKEVELYS.reviewLink}" target="_blank" rel="noopener">Share Your Review ★</a></div></div>`;
 const g=root.querySelector("div[style*='grid']");if(window.matchMedia("(min-width:640px)").matches)g.style.gridTemplateColumns="repeat(2,1fr)";if(window.matchMedia("(min-width:980px)").matches)g.style.gridTemplateColumns="repeat(3,1fr)";
 initReveal();
}
function renderAccount(){const root=document.getElementById("account-root");if(!root)return;
 const prof=getProfile(),orders=getOrders();
 const oh=orders.length?orders.map(o=>{const items=o.items.map(it=>`${it.qty}× ${it.productName}`).join(", ");return `<div class="order-item"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><span class="oid">${o.orderNo}</span><span class="odate">${formatDateID((o.createdAt||"").slice(0,10))}</span></div><p style="font-size:.88rem;color:var(--muted);margin:8px 0">${items}</p><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b style="color:var(--berry)">${rupiah(o.subtotal)}</b><a class="btn btn-wa" style="padding:9px 16px;font-size:.84rem" href="${CAKEVELYS.waLink}?text=${encodeURIComponent('Halo Cakevelys, saya ingin follow up pesanan '+o.orderNo)}" target="_blank" rel="noopener">Follow up</a></div></div>`}).join(""):`<div class="empty-state" style="padding:40px 10px"><div class="es-ic">${ICON.cart}</div><h3>Belum ada pesanan</h3><p>Pesanan kamu akan muncul di sini setelah checkout.</p><a href="#shop" class="btn btn-primary">Mulai Pesan</a></div>`;
 root.innerHTML=`<div class="account-card reveal"><h3 style="margin-bottom:4px">Profil Kamu</h3><p style="color:var(--muted);font-size:.84rem;margin-bottom:18px">Agar checkout berikutnya lebih cepat.</p>
  <div class="field"><label>Nama</label><input type="text" id="acc-name" placeholder="Nama kamu" value="${escapeAttr(prof.name)}"></div>
  <div class="field"><label>No. WhatsApp</label><input type="tel" id="acc-phone" placeholder="08xxxxxxxxxx" value="${escapeAttr(prof.phone)}"></div>
  <button class="btn btn-primary btn-block" onclick="saveAcc()">Simpan Profil</button></div>
  <div style="max-width:500px;margin:34px auto 0" class="reveal d1"><h3 style="margin-bottom:14px">Riwayat Pesanan</h3>${oh}</div>
  <p class="text-center" style="max-width:500px;margin:24px auto 0;font-size:.78rem;color:var(--muted)">Data profil & riwayat disimpan di browser perangkat ini (belum menggunakan akun online).</p>`;
 initReveal();
}
function saveAcc(){saveProfile({name:(document.getElementById("acc-name").value||"").trim(),phone:(document.getElementById("acc-phone").value||"").trim()});toast("Profil tersimpan")}

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCustomizer();closeQris();closeMobile();closeLightbox()}});
render();
requestAnimationFrame(()=>document.body.classList.add("ready"));
</script>
</body>
</html>
