<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cakevelys — Custom Cake, Cookie & Mentai Cake · Banyumanik, Semarang</title>
<meta name="description" content="Cakevelys — custom cake, cookie cake, dan mentai cake handmade dari Banyumanik, Semarang. Desain sesuai keinginanmu, pemesanan mudah lewat WhatsApp." />
<link rel="icon" href="logo%20cakevelys.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
/* =========================================================
   Cakevelys — single file · boutique bakery
   Warm cream · muted wine · Fraunces + Inter
   ========================================================= */
:root{
  --cream:#FBF7F2;--cream-2:#F4ECE3;--paper:#FFFFFF;
  --blush:#F3E6E2;--blush-2:#E9D6D0;
  --wine:#8A3A4B;--wine-d:#6E2C3B;--wine-ink:#4C2030;
  --rose:#B06A77;--gold:#B2905E;
  --ink:#33292B;--body:#6E625F;--muted:#A5978F;--line:#E9DED5;
  --shadow-xs:0 1px 2px rgba(60,30,30,.05);
  --shadow-sm:0 6px 18px rgba(110,44,59,.07);
  --shadow:0 16px 40px rgba(110,44,59,.11);
  --shadow-lg:0 28px 64px rgba(78,32,48,.16);
  --rb:10px;--r:14px;--r-lg:20px;--r-xl:28px;--pill:999px;
  --wrap:1140px;
  --fd:"Fraunces",Georgia,serif;--fb:"Inter",system-ui,sans-serif;
  --e:cubic-bezier(.22,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--fb);color:var(--body);background:var(--cream);line-height:1.68;overflow-x:clip;max-width:100%;width:100%;-webkit-font-smoothing:antialiased;opacity:0;transition:opacity .5s ease}
body.ready{opacity:1}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}ul{list-style:none;padding:0}
::selection{background:var(--blush-2);color:var(--wine-ink)}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 24px}
.section{padding-top:48px;padding-bottom:48px}
@media(min-width:860px){.section{padding-top:66px;padding-bottom:66px}}
h1,h2,h3,h4,p{overflow-wrap:break-word;word-break:break-word}
h1,h2,h3,h4{font-family:var(--fd);font-weight:500;line-height:1.16;color:var(--ink);letter-spacing:-.005em}
.hero-copy,.hero-visual,.catc,.summary,.sec-head{min-width:0}
.serif-it{font-family:var(--fd);font-style:italic;font-weight:400}
.kicker{display:inline-flex;align-items:center;gap:9px;font-family:var(--fb);font-weight:600;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
.kicker::before{content:"";width:22px;height:1px;background:var(--rose)}
.kicker.center::after{content:"";width:22px;height:1px;background:var(--rose)}
.kicker.center{justify-content:center}
.sec-head{max-width:620px;margin-bottom:32px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-head h2{font-size:clamp(1.85rem,4.4vw,2.9rem);margin-top:16px}
.sec-head p{color:var(--body);margin-top:14px}
.lead{color:var(--body)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:500;font-size:.92rem;padding:13px 26px;border-radius:var(--rb);transition:.25s var(--e);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--wine);color:#fff}
.btn-primary:hover{background:var(--wine-d);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--wine);border:1.5px solid var(--blush-2)}
.btn-outline:hover{background:var(--blush);border-color:var(--wine)}
.btn-light{background:#fff;color:var(--wine);box-shadow:var(--shadow-sm)}.btn-light:hover{transform:translateY(-2px)}
.btn-wa{background:#1FA855;color:#fff}.btn-wa:hover{background:#188544;transform:translateY(-2px)}
.btn-ghost{color:var(--wine);padding:9px 4px}.btn-ghost:hover{color:var(--wine-d)}
.btn-block{width:100%}.btn-lg{padding:15px 30px;font-size:.98rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--e),transform .8s var(--e)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}
/* header */
#app-header{display:contents}
.site-header{position:sticky;top:0;z-index:100;background:rgba(251,247,242,.82);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s var(--e)}
.site-header.scrolled{background:rgba(251,247,242,.96);border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:82px;transition:height .3s var(--e)}
.site-header.scrolled .nav{height:68px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 8px rgba(110,44,59,.12);transition:.3s var(--e)}
.site-header.scrolled .brand img{width:42px;height:42px}
.brand-tx{display:flex;flex-direction:column;justify-content:center;line-height:1;min-width:0}
.brand .wm{font-family:var(--fd);font-size:1.42rem;font-weight:600;color:var(--ink);line-height:1.08;letter-spacing:.005em}
.brand .wmsub{font-size:.58rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);margin-top:4px;white-space:nowrap}
.nav-links{display:none;align-items:center;gap:4px}
.nav-links a{position:relative;font-weight:500;font-size:.88rem;color:var(--body);padding:9px 14px;transition:.2s}
.nav-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--wine);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--e)}
.nav-links a:hover,.nav-links a.active{color:var(--wine)}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1)}
.nav-actions{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:var(--ink);transition:.2s}
.icon-btn:hover{background:var(--blush);color:var(--wine)}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 5px;background:var(--wine);color:#fff;font-size:.64rem;font-weight:700;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;border:2px solid var(--cream)}
.cart-badge.hidden{display:none}
.nav-cta{display:none}
.nav-toggle{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;color:var(--ink)}
.nav-toggle svg{width:23px;height:23px}
.mobile-menu{position:fixed;inset:0 0 0 auto;width:min(84vw,330px);z-index:120;background:var(--cream);box-shadow:var(--shadow-lg);padding:24px;transform:translateX(100%);transition:transform .34s var(--e);display:flex;flex-direction:column}
.mobile-menu.open{transform:translateX(0)}
.mm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mm-head .wm{font-family:var(--fd);font-size:1.3rem;color:var(--ink)}
.mobile-menu a{display:flex;align-items:center;gap:11px;padding:14px 4px;font-weight:500;font-size:1rem;border-bottom:1px solid var(--line);color:var(--ink)}
.mobile-menu a.active{color:var(--wine)}
.mm-foot{margin-top:auto;padding-top:16px}
.backdrop{position:fixed;inset:0;background:rgba(51,41,43,.4);backdrop-filter:blur(2px);z-index:119;opacity:0;pointer-events:none;transition:.3s}
.backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:940px){.nav-links{display:flex}.nav-toggle{display:none}.nav-cta{display:inline-flex}}
/* fab + totop */
.fab-wa{position:fixed;right:20px;bottom:20px;z-index:90;display:inline-flex;align-items:center;gap:9px;background:#1FA855;color:#fff;font-weight:500;font-size:.88rem;padding:13px 17px;border-radius:var(--pill);box-shadow:0 10px 26px rgba(31,168,85,.38);transition:.25s var(--e)}
.fab-wa svg{width:21px;height:21px}.fab-wa .lbl{display:none}
.fab-wa:hover{transform:translateY(-3px)}
@media(min-width:600px){.fab-wa .lbl{display:inline}}
.to-top{position:fixed;left:20px;bottom:20px;z-index:89;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--wine);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s var(--e)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}.to-top svg{width:19px;height:19px}
/* hero */
.hero{position:relative;overflow:hidden}
.hero-grid{display:grid;gap:32px;padding-top:30px;padding-bottom:36px;align-items:center}
.hero-copy h1{font-size:clamp(2.5rem,6vw,3.9rem);line-height:1.05;color:var(--ink);font-weight:400}
.hero-copy h1 .serif-it{color:var(--wine)}
.hero-copy .lead{font-size:1.05rem;margin:18px 0 26px;max-width:460px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.hero-trust{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.hero-trust b{color:var(--ink);font-weight:600}
.hero-trust .dot{width:4px;height:4px;border-radius:50%;background:var(--rose)}
.hero-visual{position:relative}
.hero-frame{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/4.4;background:var(--blush)}
.hero-frame img{width:100%;height:100%;object-fit:cover}
.hero-chip{position:absolute;left:18px;bottom:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:var(--pill);padding:9px 16px 9px 11px;display:flex;align-items:center;gap:9px;font-size:.82rem;font-weight:500;color:var(--ink);box-shadow:var(--shadow-sm)}
.hero-chip .hc-ic{width:28px;height:28px;border-radius:50%;background:var(--blush);color:var(--wine);display:flex;align-items:center;justify-content:center}
.hero-chip .hc-ic svg{width:15px;height:15px}
.hero-seal{position:absolute;top:-14px;right:-6px;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:var(--shadow);padding:5px}
.hero-seal img{width:100%;height:100%;border-radius:50%;object-fit:cover}
@media(min-width:900px){.hero-grid{grid-template-columns:1.06fr .94fr;padding-top:48px;padding-bottom:58px;gap:48px}.hero-visual{max-width:410px;margin-left:auto}}
/* menu / category */
.cat-grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:720px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.catc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.35s var(--e);display:flex;flex-direction:column}
.catc:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.catc .cm{aspect-ratio:4/3.3;overflow:hidden;background:var(--blush)}
.catc .cm img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--e)}
.catc:hover .cm img{transform:scale(1.06)}
.catc .cb{padding:22px 22px 24px}
.catc .cb .ct{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.catc h3{font-size:1.4rem}
.catc .cprice{font-size:.84rem;color:var(--wine);font-weight:600;white-space:nowrap}
.catc p{color:var(--body);font-size:.9rem;margin:8px 0 16px}
.catc .cgo{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--wine)}
.catc .cgo svg{width:15px;height:15px;transition:transform .25s var(--e)}
.catc:hover .cgo svg{transform:translateX(4px)}
/* story */
.story{display:grid;gap:44px;align-items:center}
@media(min-width:880px){.story{grid-template-columns:1fr 1fr}}
.story-visual{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/4.2;background:var(--blush)}
.story-visual img{width:100%;height:100%;object-fit:cover}
.vlist{margin-top:26px;display:grid;gap:18px}
.vrow{display:flex;gap:15px;align-items:flex-start}
.vrow .vi{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--blush);color:var(--wine);display:flex;align-items:center;justify-content:center}
.vrow .vi svg{width:22px;height:22px}
.vrow h4{font-size:1.06rem;margin-bottom:3px}.vrow p{font-size:.9rem;color:var(--body)}
/* testimonials */
.tgrid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:680px){.tgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column}
.tcard .stars{color:var(--gold);letter-spacing:2px;font-size:.92rem;margin-bottom:12px}
.tcard h4{font-size:1.08rem;margin-bottom:8px;font-weight:500}
.tcard p{color:var(--body);font-size:.92rem;flex:1}
.tcard .who{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.tcard .av{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--wine);font-weight:600;display:flex;align-items:center;justify-content:center;font-family:var(--fd)}
.tcard .nm{font-weight:600;font-size:.88rem;color:var(--ink)}.tcard .hd{font-size:.76rem;color:var(--muted)}
.tcard .pcat{align-self:flex-start;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);margin-bottom:12px}
/* cta band */
.ctaband{position:relative;overflow:hidden;background:var(--wine);color:#fff;border-radius:var(--r-xl);padding:56px 30px;text-align:center}
.ctaband::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 15% 0%,rgba(255,255,255,.1),transparent 50%)}
.ctaband .inr{position:relative}
.ctaband h2{color:#fff;font-size:clamp(1.7rem,4vw,2.5rem);font-weight:400}
.ctaband p{max-width:440px;margin:14px auto 26px;opacity:.9}
/* shop */
.filters{position:sticky;top:66px;z-index:40;display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none;background:var(--cream);box-shadow:0 10px 12px -10px rgba(110,44,59,.14)}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;padding:9px 18px;border-radius:var(--pill);border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:.84rem;color:var(--body);transition:.2s}
.filter:hover{border-color:var(--blush-2)}
.filter.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.cat-section{margin-top:44px;scroll-margin-top:150px}
.cat-head{margin-bottom:20px;display:flex;align-items:center;gap:13px}
.cat-head .cicon{width:42px;height:42px;border-radius:12px;background:var(--blush);color:var(--wine);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cat-head .cicon svg{width:23px;height:23px}
.cat-head h2{font-size:clamp(1.4rem,3.6vw,1.9rem);font-weight:500}
.cat-head p{color:var(--muted);font-size:.88rem;margin-top:2px}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:720px){.product-grid{grid-template-columns:repeat(3,1fr);gap:22px}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-xs);transition:.3s var(--e);cursor:pointer}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--blush-2)}
.pmedia{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--blush)}
.pmedia img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--e)}
.pcard:hover .pmedia img{transform:scale(1.06)}
.pmedia .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--rose);background:repeating-linear-gradient(45deg,var(--blush),var(--blush) 12px,var(--blush-2) 12px,var(--blush-2) 13px)}
.pmedia .ph svg{width:42px;height:42px;opacity:.7}
.pmedia .ph span{font-size:.72rem;color:var(--muted);font-weight:500}
.ptag{position:absolute;top:11px;left:11px;background:rgba(255,255,255,.93);color:var(--wine);font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:var(--pill);backdrop-filter:blur(4px)}
.pmedia .peek{position:absolute;inset:auto 0 0 0;padding:12px;display:flex;justify-content:center;transform:translateY(102%);transition:.3s var(--e)}
.pcard:hover .peek{transform:none}
.peek span{background:var(--ink);color:#fff;font-size:.74rem;font-weight:500;padding:8px 16px;border-radius:var(--pill)}
.pbody{padding:15px 15px 17px}
.psize{font-family:var(--fd);font-size:1.12rem;font-weight:500;color:var(--ink)}
.pprice{color:var(--wine);font-weight:600;margin-top:3px;font-size:.96rem}
.pprice .s{font-size:.72rem;color:var(--muted);font-weight:500}
.pprice.consult{font-size:.82rem;font-weight:600;color:var(--rose)}
.note{background:var(--blush);border:1px solid var(--blush-2);border-radius:var(--r);padding:15px 18px;font-size:.87rem;color:var(--wine-ink);display:flex;gap:12px;align-items:flex-start}
.note svg{flex:0 0 auto;width:19px;height:19px;margin-top:2px;color:var(--wine)}
/* modal */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(51,41,43,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.overlay.open{display:flex;opacity:1}
.modal{background:var(--cream);width:100%;max-width:540px;max-height:94vh;overflow-y:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-lg);transform:translateY(40px);transition:transform .3s var(--e)}
.overlay.open .modal{transform:translateY(0)}
@media(min-width:640px){.overlay{align-items:center;padding:24px}.modal{border-radius:var(--r-xl)}}
.mhead{position:sticky;top:0;background:var(--cream);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:1.2rem;font-weight:500}
.mclose{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink);transition:.2s}
.mclose:hover{background:var(--blush);color:var(--wine)}
.mbody{padding:20px}
.mmedia{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;margin-bottom:18px;background:var(--blush)}
.mmedia img{width:100%;height:100%;object-fit:cover}
.mmedia .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--rose)}
.mmedia .ph svg{width:46px;height:46px;opacity:.7}.mmedia .ph span{font-size:.8rem;color:var(--muted)}
.field{margin-bottom:17px}
.field>label{display:block;font-weight:600;font-size:.86rem;margin-bottom:8px;color:var(--ink)}
.field.two{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
.field.two label{display:block;font-weight:600;font-size:.86rem;margin-bottom:8px;color:var(--ink)}
.field .req{color:var(--wine)}
.field select,.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;transition:.15s}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--blush)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:10px 17px;border:1.5px solid var(--line);border-radius:var(--pill);background:#fff;font-size:.87rem;font-weight:500;transition:.18s;color:var(--body)}
.chip:hover{border-color:var(--blush-2)}.chip.selected{background:var(--wine);color:#fff;border-color:var(--wine)}
.levels{display:grid;gap:9px}
.level{text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:.18s;cursor:pointer;display:block}
.level:hover{border-color:var(--blush-2)}

function calcOngkir(km,veh){
 km=Number(km)||0;
 if(km<=0)return {ok:false,msg:"Masukkan estimasi jarak dulu."};
 if(km>ONGKIR.maxKm)return {ok:false,msg:`Di luar jangkauan (maks ${ONGKIR.maxKm} km). Silakan pilih Self Pick-up.`};

 else{const ex=Math.ceil(km-5);c=veh==="mobil"?40000+ex*ONGKIR.mobilPerKmOver5:15000+ex*ONGKIR.motorPerKmOver5}
 return {ok:true,cost:c};
}

function initReveal(){const els=document.querySelectorAll(".reveal:not(.in)");if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}const io=new IntersectionObserver((es,ob)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");ob.unobserve(e.target)}})},{threshold:.1,rootMargin:"0px 0px -40px 0px"});els.forEach(e=>io.observe(e))}

function getCategory(k){return CATALOG.find(c=>c.key===k)}
function getItem(k,id){const c=getCategory(k);return c?c.items.find(i=>i.id===id):null}
function renderShop(){
 const root=document.getElementById("shop-root");if(!root)return;
 root.innerHTML=CATALOG.map(cat=>{
  const cards=cat.items.map(it=>{
   const tag=it.tag?`<span class="ptag">${it.tag}</span>`:"";
   const media=it.img?`<img src="${it.img}" alt="${cat.title} ${it.size}" loading="lazy" ${FB}>`:`<div class="ph">${catIcon(cat.key)}<span>${it.consult?"Didesain khusus":"Contoh via WhatsApp"}</span></div>`;
   const priceHTML=it.consult?`<div class="pprice consult">Harga via konsultasi</div>`:`<div class="pprice"><span class="s">${(it.start||it.fillings)?"mulai ":""}</span>${rupiah(it.fillings?it.fillings[0].price:it.price)}${it.plus?"++":""}</div>`;
   return `<article class="pcard reveal" onclick="openCustomizer('${cat.key}','${it.id}')" role="button" tabindex="0">
     <div class="pmedia">${tag}${media}<div class="peek"><span>${it.consult?"Konsultasi":"Kustom & Pesan"}</span></div></div>
     <div class="pbody"><div class="psize">${it.size}</div>${priceHTML}</div></article>`;
  }).join("");
  return `<section class="cat-section" id="cat-${cat.key}" data-cat="${cat.key}"><div class="cat-head"><span class="cicon">${catIcon(cat.key)}</span><div><h2>${cat.title}</h2><p>${cat.blurb}</p></div></div><div class="product-grid">${cards}</div></section>`;
 }).join("");
 initReveal();
}
function filterShop(key,btn){

 document.querySelectorAll(".cat-section").forEach(s=>{s.style.display=(key==="all"||s.dataset.cat===key)?"":"none"});
 if(key!=="all"){const el=document.getElementById("cat-"+key);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}else window.scrollTo({top:document.getElementById("shop-root").offsetTop-160,behavior:"smooth"});
}
let CZ=null;
function openCustomizer(catKey,itemId){
 const cat=getCategory(catKey),item=getItem(catKey,itemId);if(!cat||!item)return;
 CZ={catKey,itemId,flavour:cat.options?.flavour?cat.options.flavour.choices[0].name:null,flavourAdd:cat.options?.flavour?cat.options.flavour.choices[0].add:0,shape:cat.options?.shape?cat.options.shape.choices[0].name:null,filling:item.fillings?item.fillings[0].name:null,fillingPrice:item.fillings?item.fillings[0].price:null,level:"simple",text:"",addons:{},qty:1,date:""};
 buildModal(cat,item);document.getElementById("cz-overlay").classList.add("open");document.body.style.overflow="hidden";
}
function closeCustomizer(){document.getElementById("cz-overlay")?.classList.remove("open");document.body.style.overflow="";CZ=null}
function buildModal(cat,item){
 let ov=document.getElementById("cz-overlay");
 if(!ov){ov=document.createElement("div");ov.id="cz-overlay";ov.className="overlay";ov.addEventListener("click",e=>{if(e.target===ov)closeCustomizer()});document.body.appendChild(ov)}
 let fl="";if(cat.options?.flavour){const o=cat.options.flavour.choices.map(c=>`<option value="${c.name}" data-add="${c.add}">${c.name}${c.desc?" — "+c.desc:""}</option>`).join("");fl=`<div class="field"><label>${cat.options.flavour.label} <span class="req">*</span></label><select id="cz-flavour" onchange="onFlavourChange()">${o}</select></div>`}
 let sh="";if(cat.options?.shape){const ch=cat.options.shape.choices.map((c,i)=>`<button type="button" class="chip ${i===0?"selected":""}" onclick="onShapePick(this,'${c.name}')">${c.name}</button>`).join("");sh=`<div class="field"><label>${cat.options.shape.label} <span class="req">*</span></label><div class="chips" id="cz-shape">${ch}</div></div>`}
 let fi="";if(item.fillings){const ch=item.fillings.map((f,i)=>`<button type="button" class="chip ${i===0?"selected":""}" onclick="onFillingPick(this,'${f.name}',${f.price})">${f.name} · ${rupiah(f.price)}</button>`).join("");fi=`<div class="field"><label>Topping <span class="req">*</span></label><div class="chips" id="cz-filling">${ch}</div></div>`}
 let tx="";if(cat.hasText){tx=`<div class="field"><label>Request Tulisan / Karakter</label><textarea id="cz-text" placeholder="Contoh: Tulisan 'Happy Birthday Sarah', karakter Hello Kitty, warna pastel pink..." oninput="CZ.text=this.value"></textarea><div class="hint">Butuh inspirasi? Intip galeri desain kami di <a href="${CAKEVELYS.instagram}" target="_blank" rel="noopener" style="color:var(--wine);font-weight:600">Instagram @cakevelys</a>. Foto referensi dikirim via WhatsApp setelah pembayaran.</div></div>`}
 const dl=`<div class="field"><label>Tingkat Kerumitan Desain <span class="req">*</span></label><div class="levels" id="cz-levels">${DESIGN_LEVELS.map((l,i)=>`<button type="button" class="level ${i===0?"selected":""}" onclick="onLevelPick(this,'${l.id}')"><span class="lv-top"><span class="lv-name">${l.name}</span><span class="lv-fee">${l.fee?"+"+rupiah(l.fee):"Gratis"}</span></span><span class="lv-desc">${l.desc}</span></button>`).join("")}</div><div class="hint">Design fee otomatis sesuai tingkat kerumitan — estimasi, final dikonfirmasi admin.</div></div>`;
 const ad=ADDONS.map(a=>a.qty?`<label class="addon"><input type="checkbox" onchange="onAddonToggle('${a.id}',this.checked)"><span class="an">${a.name} <span class="ap">(${a.note})</span></span><span class="qm"><input type="number" id="addon-qty-${a.id}" min="1" value="1" onchange="onAddonQty('${a.id}',this.value)"><span style="font-size:.78rem;color:var(--muted)">pcs</span></span></label>`:`<label class="addon"><input type="checkbox" onchange="onAddonToggle('${a.id}',this.checked)"><span class="an">${a.name}</span><span class="ap">${a.note}</span></label>`).join("");
 const isConsult=!!item.consult;
 const media=item.img?`<img src="${item.img}" alt="${cat.title} ${item.size}" onerror="this.src='${CAKEVELYS.logo}';this.style.objectFit='contain';this.style.padding='22px';this.style.background='#fff'">`:`<div class="ph">${catIcon(cat.key)}<span>${isConsult?"Didesain khusus bersamamu":"Contoh desain via WhatsApp"}</span></div>`;

function onQty(d){CZ.qty=Math.max(1,CZ.qty+d);document.getElementById("cz-qty").value=CZ.qty;refreshTotal()}
function onQtyInput(v){CZ.qty=Math.max(1,Number(v)||1);document.getElementById("cz-qty").value=CZ.qty;refreshTotal()}
function refreshTotal(){const e=document.getElementById("cz-total");if(e)e.textContent=rupiah(czTotal());const br=document.getElementById("cz-break");if(br)br.innerHTML=czBreakHTML()}
function czUnitPrice(){const item=getItem(CZ.catKey,CZ.itemId);let base=item.fillings?(CZ.fillingPrice!=null?CZ.fillingPrice:item.fillings[0].price):item.price;let u=base+(CZ.flavourAdd||0);for(const id in CZ.addons){const a=ADDONS.find(x=>x.id===id);u+=a.price*(CZ.addons[id].qty||1)}return u}

   <div style="display:flex;align-items:center;gap:14px"><span class="lp">${rupiah(it.lineTotal)}</span><button class="rm" onclick="removeItem('${it.uid}')">${I.trash} Hapus</button></div></div></div></div>`;

 const big=cartHasBig(cart);
 window.__sub=subProduct;window.__estfee=estFee;window.__voucher=null;window.__bigCake=big;window.__ongkir=0;window.__deliveryBlocked=false;
 const vehField=big

 root.innerHTML=`<div class="cart-layout"><div><h2 style="margin-bottom:18px;font-size:1.45rem;font-weight:500">Keranjang · ${cartCount()} item</h2>${items}<a href="#shop" class="btn btn-ghost">${I.chevL} Lanjut belanja</a></div>
  <div><div class="summary"><h3>Rampungkan Pesanan</h3><p class="sub">Beberapa detail terakhir, lalu momenmu siap kami rangkai.</p>

   <div class="pickup-date">${I.clock}<span>Tanggal pengambilan: <b>${dateLabel}</b></span></div>
   <div class="field"><label>Atas Nama <span class="req">*</span></label><input type="text" id="buyer-name" placeholder="Nama pemesan" value="${escapeAttr(prof.name)}"></div>
   <div class="field"><label>No. WhatsApp <span class="req">*</span></label><input type="tel" id="buyer-phone" placeholder="08xxxxxxxxxx" value="${escapeAttr(prof.phone)}"></div>

   <div class="field hidden" id="delivery-box">
     <div class="dbx">

       <div class="field"><label>Kecamatan (Kota Semarang)</label><select id="deliv-area" onchange="onAreaChange()"><option value="">— Pilih kecamatan —</option>${AREAS.map(a=>`<option value="${a.km}">${a.n} (±${a.km} km)</option>`).join("")}<option value="luar">Luar Kota Semarang (tidak tersedia)</option></select></div>
       <div class="field"><label>Alamat Pengiriman</label><textarea id="deliv-addr" placeholder="Alamat lengkap + patokan"></textarea></div>

function effFee(){const f=Number(document.getElementById("buyer-fee")?.value||0);return f>0?{fee:f,confirmed:true}:{fee:window.__estfee||0,confirmed:false}}
function discountFor(base){const code=window.__voucher;if(!code)return 0;const v=VOUCHERS[code];if(!v)return 0;if(v.min&&base<v.min)return 0;let d=v.type==="percent"?Math.round(base*v.value/100):v.value;return Math.min(d,base)}
function currentMethod(){return document.getElementById("buyer-method")?.value||"Self Pick-up"}
function isDelivery(){return currentMethod().indexOf("Pengiriman")>=0}
function onMethodChange(){const box=document.getElementById("delivery-box");if(box)box.classList.toggle("hidden",!isDelivery());recalc()}
function onAreaChange(){const a=document.getElementById("deliv-area")?.value,km=document.getElementById("deliv-km");if(a&&a!=="luar"&&km)km.value=a;recalc()}
function recalc(){
 const ef=effFee(),sub=window.__sub||0,base=sub+ef.fee,disc=discountFor(base);
 const sf=document.getElementById("sumfee");if(sf)sf.textContent=rupiah(ef.fee);
 const ft=document.getElementById("feetag");if(ft)ft.textContent=ef.confirmed?"(dari admin)":"(estimasi)";
 const vr=document.getElementById("voucher-srow");
 if(window.__voucher&&disc>0){vr.classList.remove("hidden");document.getElementById("vouchertag").textContent=window.__voucher;document.getElementById("sumvoucher").textContent="− "+rupiah(disc)}
 else if(vr){vr.classList.add("hidden")}
 // ongkir
 let ongkir=0,blocked=false,msg="";
 const or=document.getElementById("sumongkir"),dm=document.getElementById("deliv-msg");
 if(isDelivery()){
   const area=document.getElementById("deliv-area")?.value;
   if(area==="luar"){blocked=true;msg=`Maaf, pengiriman hanya untuk Kota Semarang. Silakan pilih Self Pick-up untuk area luar kota.`}
   else{
     const km=Number(document.getElementById("deliv-km")?.value||0);
     let veh=window.__bigCake?"mobil":(document.getElementById("deliv-veh")?.value||"motor");
     if(km<=0){msg="Masukkan estimasi jarak untuk menghitung ongkir."}
     else{const r=calcOngkir(km,veh);if(r.ok){ongkir=r.cost;msg=`Ongkir ${veh==="mobil"?"mobil":"motor"} untuk ${km} km: <b>${rupiah(r.cost)}</b>`}else{blocked=true;msg=r.msg}}
   }
   if(or)or.textContent=ongkir>0?rupiah(ongkir):(blocked?"tidak tersedia":"—");
   if(dm){dm.innerHTML=msg;dm.className="dbx-msg"+(blocked?" err":ongkir>0?" ok":"")}
 }else{if(or)or.textContent="— (ambil sendiri)";if(dm)dm.innerHTML=""}
 window.__ongkir=ongkir;window.__deliveryBlocked=blocked;
 const st=document.getElementById("sumtotal");if(st)st.textContent=rupiah(base-disc+ongkir);
}
function applyVoucher(){
 const code=(document.getElementById("voucher-code").value||"").trim().toUpperCase();
 const msg=document.getElementById("voucher-msg");
 if(!code){window.__voucher=null;msg.textContent="";msg.style.color="";recalc();return}
 const v=VOUCHERS[code];
 if(!v){window.__voucher=null;msg.textContent="Kode voucher tidak ditemukan.";msg.style.color="var(--wine)";recalc();return}
 const base=(window.__sub||0)+effFee().fee;
 if(v.min&&base<v.min){window.__voucher=null;msg.textContent=`Minimal belanja ${rupiah(v.min)} untuk voucher ini.`;msg.style.color="var(--wine)";recalc();return}
 window.__voucher=code;msg.textContent=`✓ ${v.label} diterapkan.`;msg.style.color="#1FA855";recalc();
}
function changeQty(uid,d){const c=getCart(),it=c.find(x=>x.uid===uid);if(!it)return;it.qty=Math.max(1,it.qty+d);it.lineTotal=it.unitPrice*it.qty;saveCart(c);renderCart()}
function setQty(uid,v){const c=getCart(),it=c.find(x=>x.uid===uid);if(!it)return;it.qty=Math.max(1,Number(v)||1);it.lineTotal=it.unitPrice*it.qty;saveCart(c);renderCart()}
function removeItem(uid){saveCart(getCart().filter(x=>x.uid!==uid));renderCart();toast("Item dihapus",false)}
function val(id){return (document.getElementById(id)?.value||"").trim()}
function startCheckout(mode){
 const name=val("buyer-name"),phone=val("buyer-phone");
 if(!name||!phone){toast("Lengkapi nama & WhatsApp dulu ya",false);[["buyer-name",name],["buyer-phone",phone]].forEach(([id,v])=>{const el=document.getElementById(id);if(el&&!v){el.style.borderColor="var(--wine)";el.focus()}});return}
 recalc();
 const cart=getCart();
 let delivery=null;
 if(isDelivery()){
   if(window.__deliveryBlocked){toast("Pengiriman tidak tersedia untuk area/jarak ini.",false);document.getElementById("deliv-km")?.focus();return}
   const addr=val("deliv-addr"),km=Number(val("deliv-km")||0);
   if(!addr){toast("Isi alamat pengiriman dulu ya",false);document.getElementById("deliv-addr")?.focus();return}
   if(km<=0){toast("Masukkan estimasi jarak dulu ya",false);document.getElementById("deliv-km")?.focus();return}
   const veh=window.__bigCake?"Mobil":(document.getElementById("deliv-veh")?.value==="mobil"?"Mobil":"Motor");
   delivery={area:"Kota Semarang",addr,km,veh,cost:window.__ongkir||0};
 }
 saveProfile({name,phone});
 const subtotal=cart.reduce((s,it)=>s+lineProduct(it),0);
 const ef=effFee(),base=subtotal+ef.fee,disc=discountFor(base);
 const voucher=(window.__voucher&&disc>0)?{code:window.__voucher,amount:disc}:null;
 const dates=[...new Set(cart.map(it=>it.date).filter(Boolean))];
 const total=base-disc+(delivery?delivery.cost:0);
 openQris({orderNo:genOrderNo(),name,phone,dates,method:currentMethod(),delivery,note:val("buyer-note"),items:cart,subtotal,fee:ef.fee,feeConfirmed:ef.confirmed,voucher,total,createdAt:new Date().toISOString()},mode||"wa");
}

 if(!ov){ov=document.createElement("div");ov.id="qris-overlay";ov.className="overlay";ov.addEventListener("click",e=>{if(e.target===ov)closeQris()});document.body.appendChild(ov)}

     <ul class="steps">

}
function closeQris(){document.getElementById("qris-overlay")?.classList.remove("open");document.body.style.overflow=""}
function confirmAndWhatsApp(){const o=window.__activeOrder;if(!o)return;const url=`${CAKEVELYS.waLink}?text=${encodeURIComponent(buildWaMessage(o))}`;saveOrder(o);saveCart([]);window.open(url,"_blank");closeQris();showThankYou(o,false)}
function confirmInApp(){const o=window.__activeOrder;if(!o)return;saveOrder(o);saveCart([]);closeQris();showThankYou(o,true)}
function copyOrder(){const o=window.__activeOrder;if(!o)return;const txt=buildWaMessage(o).replace(/\*/g,"");navigator.clipboard?.writeText(txt).then(()=>toast("Ringkasan pesanan disalin")).catch(()=>toast("Gagal menyalin",false))}
/* Form konfirmasi terstruktur (pakai bold WhatsApp) */
function buildWaMessage(o){
 const L=[];
 L.push("*KONFIRMASI PESANAN — CAKEVELYS*");
 L.push("———————————————");
 const dd=(o.dates&&o.dates.length===1)?formatDateID(o.dates[0]):(o.dates&&o.dates.length>1?"(lihat per item)":formatDateID(o.date));
 L.push("No. Pesanan   : "+o.orderNo);
 L.push("Atas Nama     : "+o.name);
 L.push("No. WhatsApp  : "+o.phone);
 L.push("Tanggal       : "+dd);
 L.push("Metode        : "+o.method);
 L.push("");
 L.push("*RINCIAN PESANAN*");
 o.items.forEach((it,i)=>{
   L.push((i+1)+". "+it.productName);
   if(it.date)L.push("    - Tanggal  : "+formatDateID(it.date));
   if(it.flavour)L.push("    - Rasa     : "+it.flavour);
   if(it.shape)L.push("    - Bentuk   : "+it.shape);
   if(it.filling)L.push("    - Topping  : "+it.filling);
   if(it.designLevel)L.push("    - Desain   : "+it.designLevel+(it.designFee?" (design fee "+rupiah(it.designFee)+")":""));
   if(it.text)L.push("    - Tulisan  : \""+it.text+"\"");
   if(it.addons&&it.addons.length)L.push("    - Add-on   : "+it.addons.map(a=>a.name).join(", "));
   L.push("    - Harga    : "+it.qty+" x "+rupiah(it.unitPrice)+" = "+rupiah(lineProduct(it)));
 });
 if(o.delivery){
   L.push("");
   L.push("*PENGIRIMAN*");
   L.push("Alamat    : "+o.delivery.addr);
   L.push("Jarak     : "+o.delivery.km+" km ("+o.delivery.veh+")");
 }
 L.push("");
 L.push("*PEMBAYARAN*");
 L.push("Subtotal kue  : "+rupiah(o.subtotal));
 L.push("Design fee    : "+(o.fee>0?rupiah(o.fee)+(o.feeConfirmed?" (sesuai konsultasi)":" (estimasi)"):"Gratis / desain simpel"));
 if(o.voucher)L.push("Voucher       : "+o.voucher.code+" (- "+rupiah(o.voucher.amount)+")");
 L.push("Ongkir        : "+(o.delivery?rupiah(o.delivery.cost):"- (ambil sendiri)"));
 L.push("Total         : "+rupiah(o.total));
 L.push("Metode bayar  : QRIS - sudah transfer");
 L.push("");
 L.push("*LANGKAH SELANJUTNYA*");
 L.push("Saya akan langsung kirim foto *referensi desain* di chat ini, sekalian lampirkan *bukti pembayaran* ya.");
 if(o.note){L.push("");L.push("*CATATAN*");L.push(o.note)}
 L.push("");
 L.push("Terima kasih, mohon diproses ya 🤍");
 return L.join("\n");
}
function showThankYou(o,inApp){
 const root=document.getElementById("cart-root");if(!root)return;
 const waUrl=`${CAKEVELYS.waLink}?text=${encodeURIComponent(buildWaMessage(o))}`;
 const lead=inApp
   ?`Pesananmu sudah tercatat di aplikasi. Agar kami bisa mulai merangkainya, <b>kirim bukti bayar & foto referensi desain</b> ke WhatsApp ya.`
   :`Tab WhatsApp sudah terbuka — tinggal kirim form beserta <b>bukti bayar & foto referensi desain</b>.`;
 root.innerHTML=`<div class="receipt">
   <div class="ei">${I.check}</div>
   <h3>Terima kasih, ${escapeHTML(o.name.split(" ")[0]||o.name)} 🤍</h3>
   <p class="rsub">${lead}</p>
   <div class="rcard">
     <div class="rrow"><span>No. Pesanan</span><b>${o.orderNo}</b></div>
     <div class="rrow"><span>Total</span><b style="color:var(--wine)">${rupiah(o.total)}</b></div>
     <div class="rrow"><span>Metode</span><b>${o.method}</b></div>
     ${o.delivery?`<div class="rrow"><span>Ongkir</span><b>${rupiah(o.delivery.cost)} · ${o.delivery.veh}</b></div>`:""}
   </div>
   <p class="rins">Butuh inspirasi desain? Intip <a href="${CAKEVELYS.instagram}" target="_blank" rel="noopener">Instagram @cakevelys</a>.</p>
   <div class="ractions">
     <a class="btn btn-wa btn-lg" href="${waUrl}" target="_blank" rel="noopener">${I.wa} ${inApp?"Kirim ke WhatsApp":"Buka WhatsApp"}</a>
     <button class="btn btn-outline btn-lg" onclick="copyOrder()">Salin Ringkasan</button>
     <a class="btn btn-ghost" href="#shop">Pesan Lagi</a>
   </div></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function genOrderNo(){const d=new Date();return `${CAKEVELYS.orderPrefix}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.floor(1000+Math.random()*9000)}`}
function pad(n){return String(n).padStart(2,"0")}
function minPickupDate(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function formatDateID(iso){if(!iso)return"-";const[y,m,day]=iso.split("-");const b=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];return `${day} ${b[Number(m)-1]} ${y}`}

/* ===== REVIEW + ACCOUNT ===== */
function renderReviews(){const root=document.getElementById("review-root");if(!root)return;
 root.innerHTML=`<div class="tgrid">${REVIEWS.map((r,i)=>tCard(r,i%3)).join("")}</div>
  <div class="ctaband reveal" style="margin-top:44px"><div class="inr"><h2>Your Sweet Words Matter ♡</h2><p>Udah pernah cobain Cakevelys? Ceritain pengalaman kamu juga, dong!</p><a class="btn btn-light btn-lg" href="${CAKEVELYS.reviewLink}" target="_blank" rel="noopener">Share Your Review ★</a></div></div>`;
 initReveal();
}
function renderAccount(){const root=document.getElementById("account-root");if(!root)return;
 const prof=getProfile(),orders=getOrders();
 const oh=orders.length?orders.map(o=>{const items=o.items.map(it=>`${it.qty}× ${it.productName}`).join(", ");return `<div class="oitem"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><span class="oid">${o.orderNo}</span><span class="od">${formatDateID((o.createdAt||"").slice(0,10))}</span></div><p style="font-size:.88rem;color:var(--muted);margin:8px 0">${items}</p><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b style="color:var(--wine)">${rupiah(o.total||o.subtotal)}</b><a class="btn btn-wa" style="padding:9px 16px;font-size:.84rem" href="${CAKEVELYS.waLink}?text=${encodeURIComponent('Halo Cakevelys, saya ingin follow up pesanan '+o.orderNo)}" target="_blank" rel="noopener">Follow up</a></div></div>`}).join(""):`<div class="empty" style="padding:40px 10px"><div class="ei">${I.cart}</div><h3>Belum ada pesanan</h3><p>Pesanan kamu akan muncul di sini setelah checkout.</p><a href="#shop" class="btn btn-primary">Mulai Pesan</a></div>`;
 root.innerHTML=`<div class="acard reveal"><h3 style="margin-bottom:4px;font-weight:500">Profil Kamu</h3><p style="color:var(--muted);font-size:.84rem;margin-bottom:18px">Agar checkout berikutnya lebih cepat.</p>
  <div class="field"><label>Nama</label><input type="text" id="acc-name" placeholder="Nama kamu" value="${escapeAttr(prof.name)}"></div>
  <div class="field"><label>No. WhatsApp</label><input type="tel" id="acc-phone" placeholder="08xxxxxxxxxx" value="${escapeAttr(prof.phone)}"></div>
  <button class="btn btn-primary btn-block" onclick="saveAcc()">Simpan Profil</button></div>
  <div style="max-width:500px;margin:34px auto 0" class="reveal d1"><h3 style="margin-bottom:14px;font-weight:500">Riwayat Pesanan</h3>${oh}</div>
  <p style="text-align:center;max-width:500px;margin:24px auto 0;font-size:.78rem;color:var(--muted)">Data profil & riwayat disimpan di browser perangkat ini (belum menggunakan akun online).</p>`;
 initReveal();
}
function saveAcc(){saveProfile({name:(document.getElementById("acc-name").value||"").trim(),phone:(document.getElementById("acc-phone").value||"").trim()});toast("Profil tersimpan")}

/* ===== boot ===== */
window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCustomizer();closeQris();closeMobile();closeLightbox()}});
render();
requestAnimationFrame(()=>document.body.classList.add("ready"));
</script>
</body>
</html>
